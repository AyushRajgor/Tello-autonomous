<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TelloAI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- Main View Area (Video + HUD) -->
  <div class="view-area">
    <!-- Header -->
    <div class="top-header">
      <div class="brand">
        <div class="logo">TELLO<span>AI</span></div>
      </div>
      <div class="status-badges">
        <div class="badge connection-badge disconnected" id="status-pill">
          <div class="dot"></div>
          <span id="connection-status">Connecting</span>
        </div>
        <div class="badge webcam-badge" id="webcam-badge" style="display:none">
          <div class="dot"></div>
          <span id="video-source-label">Video</span>
        </div>
      </div>
    </div>

    <!-- Video Feed -->
    <div class="video-container">
      <img id="video-frame" style="display:none" />
      <div class="video-placeholder" id="video-placeholder">
        <div class="noise-overlay"></div>
        <div class="placeholder-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" /><rect x="3" y="6" width="12" height="12" rx="2" /></svg>
        </div>
        <div class="placeholder-text">WAITING FOR VIDEO SIGNAL</div>
      </div>
    </div>

    <!-- Telemetry Strip -->
    <div class="telemetry-strip">
      <div class="tel-item pos">
        <div class="tel-lbl">POS</div>
        <div class="tel-val" id="tel-pos">0, 0, 0</div>
      </div>
      <div class="tel-item">
        <div class="tel-lbl">HDG</div>
        <div class="tel-val" id="tel-heading">0°</div>
      </div>
      <div class="tel-item">
        <div class="tel-lbl">DST</div>
        <div class="tel-val" id="tel-dist">0cm</div>
      </div>
      <div class="tel-item">
        <div class="tel-lbl">ALT</div>
        <div class="tel-val" id="tel-alt">0cm</div>
      </div>
      <div class="tel-item">
        <div class="tel-lbl">STS</div>
        <div class="tel-val inactive" id="tel-flying">GND</div>
      </div>
      <div class="tel-item">
        <div class="tel-lbl">TME</div>
        <div class="tel-val" id="tel-time">0s</div>
      </div>
    </div>
  </div>

  <!-- Side Control Panel -->
  <div class="side-panel">
    <!-- Tabs Header -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('controls')" id="tab-btn-controls">Controls</button>
      <button class="tab-btn" onclick="switchTab('traces')" id="tab-btn-traces">Traces</button>
    </div>

    <div id="tab-controls" class="tab-content active-tab">
      <!-- Quick Actions -->
      <div class="panel-section quick-actions">
        <span class="section-title">FLIGHT CONTROLS</span>
        <div class="actions-grid">
          <button class="action-btn primary" onclick="quickCmd('take off')">Takeoff</button>
          <button class="action-btn danger" onclick="quickCmd('land')">Land</button>
          <button class="action-btn" onclick="quickCmd('move forward 50cm')">Forward</button>
          <button class="action-btn" onclick="quickCmd('flip forward')">Flip</button>
          <button class="action-btn" onclick="quickCmd('rotate 360 degrees')">Spin</button>
          <button class="action-btn" onclick="quickCmd('what do you see?')">Observe</button>
        </div>
      </div>

      <!-- Agent Chat -->
      <div class="chat-section">
        <div class="section-title chat-header">AI AGENT</div>
        <div class="chat-messages" id="chat-messages">
          <div class="msg system">System initialized. Awaiting commands.</div>
        </div>
        <div class="chat-input-wrapper">
          <button class="mic-btn" id="mic-btn"
                  onmousedown="startMic()" onmouseup="stopMic()" onmouseleave="stopMic()"
                  ontouchstart="startMic(event)" ontouchend="stopMic(event)"
                  title="Hold to talk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <input type="text" id="chat-input" placeholder="Hold mic to talk, or type a command..." autocomplete="off" />
          <button class="send-btn" onclick="sendMessage()" title="Send Command">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Traces Tab -->
    <div id="tab-traces" class="tab-content" style="display: none;">
      <div class="session-stats" id="session-stats">
        Session stats loading...
      </div>
      <div id="traces-list-view" class="traces-list">
        <!-- Trace rows go here -->
      </div>
      <div id="traces-detail-view" class="trace-detail" style="display: none;">
        <div id="trace-detail-content" class="trace-detail-content"></div>
      </div>
    </div>
  </div>
</div>

<!-- Kept legacy IDs hidden for backward JS compatibility if needed, but updated UI -->
<span id="inst-battery" style="display:none"></span>
<span id="inst-battery-bar" style="display:none"></span>
<span id="inst-heading" style="display:none"></span>
<span id="inst-alt" style="display:none"></span>
<span id="inst-alt-bar" style="display:none"></span>
<span id="battery" style="display:none"></span>
<span id="battery-fill" style="display:none"></span>

<script src="/static/script.js"></script>
</body>
</html>
